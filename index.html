<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>804 — Signals</title>
<link rel="icon" id="fav" href="">
<style>
:root{
  --bg:#05060f;--p:#0c1024;--p2:#131a3a;--bd:#243066;
  --a:#22d3ee;--a2:#a855f7;--g:#22f08a;--r:#ff4d6d;--tx:#f4f6ff;--t2:#8d97c4;
  --glow:color-mix(in srgb,var(--a) 45%,transparent);
}
[data-theme="gold"]{--bg:#0a0805;--p:#16110a;--p2:#211a0d;--bd:#4a3a17;--a:#fbbf24;--a2:#f97316;--t2:#b3a27a}
[data-theme="emerald"]{--bg:#03100c;--p:#08201a;--p2:#0d2d25;--bd:#155040;--a:#34d399;--a2:#22d3ee;--t2:#82b8a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}

/* ---------- animated background ---------- */
.bgfx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:var(--bg)}
.bgfx:before{content:"";position:absolute;inset:-50%;background-image:linear-gradient(color-mix(in srgb,var(--a) 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--a) 7%,transparent) 1px,transparent 1px);background-size:42px 42px;transform:perspective(500px) rotateX(58deg) translateY(0);transform-origin:50% 100%;animation:grid 6s linear infinite;mask-image:linear-gradient(transparent,#000 70%)}
@keyframes grid{to{background-position:0 42px}}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 14s ease-in-out infinite}
.o1{width:320px;height:320px;background:var(--a2);top:-90px;right:-80px}
.o2{width:280px;height:280px;background:var(--a);bottom:10%;left:-120px;animation-delay:-5s;opacity:.28}
.o3{width:200px;height:200px;background:var(--g);top:45%;right:-90px;animation-delay:-9s;opacity:.14}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.15)}}
.pt{position:fixed;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);opacity:.6;z-index:-1;animation:upw linear infinite}
@keyframes upw{to{transform:translateY(-110vh) translateX(30px);opacity:0}}

/* ---------- layout ---------- */
.app{max-width:480px;margin:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(96px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 18px;animation:dn .7s both}
@keyframes dn{from{opacity:0;transform:translateY(-16px)}}
.logo{position:relative;width:54px;height:54px;flex:none}
.logo img{width:100%;height:100%;border-radius:50%;animation:lg 4s ease-in-out infinite;position:relative;z-index:1}
.logo:before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,var(--a),var(--a2),transparent 60%,var(--a));animation:spin 3s linear infinite;filter:blur(2px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lg{50%{transform:scale(1.05)}}
.hd h1{margin:0;font-size:28px;letter-spacing:.12em;background:linear-gradient(90deg,#fff,var(--a),var(--a2));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
.hd small{display:block;color:var(--t2);letter-spacing:.3em;font-size:9px}
.sp{flex:1}
.chip{font-size:10px;letter-spacing:.1em;border:1px solid;border-radius:99px;padding:4px 11px;display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--p) 80%,transparent);backdrop-filter:blur(6px)}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2;transform:scale(.6)}}

.cd{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--p2) 88%,transparent),color-mix(in srgb,var(--p) 88%,transparent));border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);animation:inn .6s both;overflow:hidden}
.cd:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);transform:skewX(-20deg);animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
@keyframes inn{from{opacity:0;transform:translateY(22px) scale(.97)}}
#v-home>*:nth-child(1){animation-delay:.05s}#v-home>*:nth-child(2){animation-delay:.15s}#v-home>*:nth-child(3){animation-delay:.25s}#v-home>*:nth-child(4){animation-delay:.35s}
.st2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0}
.st2 .cd{margin:0;padding:14px}
.st2 small{color:var(--t2);font-size:10px;letter-spacing:.16em}
.st2 b{display:block;font-size:34px;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}

.go{position:relative;overflow:hidden;width:100%;border:0;border-radius:18px;padding:18px;font-size:16px;font-weight:900;letter-spacing:.14em;color:#04050d;cursor:pointer;background:linear-gradient(110deg,var(--a),var(--a2),var(--a));background-size:250% 100%;animation:gb 3s linear infinite,pulse 2.2s ease-in-out infinite;box-shadow:0 10px 30px var(--glow);transition:transform .15s;margin:14px 0}
.go:before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:gl 2.4s ease-in-out infinite}
@keyframes gl{0%{left:-80%}60%,100%{left:150%}}
@keyframes gb{to{background-position:250% 0}}
@keyframes pulse{50%{box-shadow:0 10px 46px var(--glow),0 0 0 6px color-mix(in srgb,var(--a) 14%,transparent)}}
.go:active{transform:scale(.96)}
.rpl{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}

h2{margin:0 0 10px;font-size:12px;letter-spacing:.22em;color:var(--t2);display:flex;align-items:center;gap:8px}
h2:before{content:"";width:16px;height:2px;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:2px}
.empty{text-align:center;color:var(--t2);padding:18px 6px}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid color-mix(in srgb,var(--bd) 70%,transparent);animation:ro .5s both}
.row:last-child{border:0}
@keyframes ro{from{opacity:0;transform:translateX(-16px)}}
.up{color:var(--g)}.dn2,.dn{color:var(--r)}
.row b{font-size:13px}.row small{color:var(--t2);display:block;font-size:11px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-weight:800;font-size:12px;letter-spacing:.06em;border:1px solid}
.tag.up{background:color-mix(in srgb,var(--g) 14%,transparent);border-color:color-mix(in srgb,var(--g) 50%,transparent)}
.tag.dn{background:color-mix(in srgb,var(--r) 14%,transparent);border-color:color-mix(in srgb,var(--r) 50%,transparent)}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--p) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--t2);font-size:11px;cursor:pointer;position:relative;transition:color .25s}
nav button span{display:block;font-size:21px;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
nav button.on{color:var(--a)}
nav button.on span{transform:translateY(-3px) scale(1.2)}
nav button:before{content:"";position:absolute;top:0;left:50%;right:50%;height:3px;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:0 0 4px 4px;transition:.35s}
nav button.on:before{left:25%;right:25%;box-shadow:0 0 14px var(--a)}

.fl{display:flex;gap:8px;margin-bottom:10px}
.fl button{flex:1;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:12px;padding:9px;color:var(--t2);cursor:pointer;transition:.25s}
.fl button.on{border-color:var(--a);color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--a) 25%,transparent)}
label{display:block;margin:12px 0 4px;color:var(--t2);font-size:12px}
select,input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 70%,transparent);transition:.25s}
select:focus,input:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent)}
.sm{position:relative;overflow:hidden;margin-top:12px;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:12px;padding:11px 16px;cursor:pointer;transition:.2s}
.sm:active{transform:scale(.96)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{border:2px solid var(--bd);border-radius:14px;padding:10px 4px;cursor:pointer;text-align:center;font-size:11px;background:var(--bg);transition:.3s}
.th i{display:block;height:22px;border-radius:8px;margin-bottom:6px}
.th.on{border-color:var(--a);transform:scale(1.05);box-shadow:0 0 18px var(--glow)}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer}
.sw input{width:auto}

/* ---------- bottom sheet ---------- */
.ov{position:fixed;inset:0;background:rgba(2,3,10,.72);z-index:30;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.ov.on{display:flex;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--bd);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:su .45s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 50px var(--glow)}
@keyframes su{from{transform:translateY(100%)}}
.sh{display:flex;align-items:center;margin-bottom:12px}.sh b{font-size:18px}
.x{margin-left:auto;border:1px solid var(--bd);background:var(--bg);border-radius:50%;width:34px;height:34px;cursor:pointer;transition:.3s}.x:hover{transform:rotate(90deg)}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tg button{border:1px solid var(--bd);background:var(--bg);border-radius:13px;padding:11px 0;font-weight:700;cursor:pointer;transition:.25s;animation:ro .4s both}
.tg button.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);box-shadow:0 0 16px var(--glow);transform:scale(1.08)}
.al{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ai{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);background:var(--bg);border-radius:13px;padding:11px 12px;cursor:pointer;animation:ro .35s both;transition:.2s}
.ai:hover{border-color:color-mix(in srgb,var(--a) 50%,var(--bd))}
.ai.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}
.ai i{margin-left:auto;font-style:normal;color:var(--a);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.otc{font-size:9px;color:var(--a2);border:1px solid var(--a2);border-radius:6px;padding:0 5px}

/* ---------- run overlay ---------- */
.run{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow:auto}
.run.on{display:block;animation:fd .3s}
.run .bgfx{position:absolute;z-index:0}
.sc{position:relative;z-index:1;max-width:480px;margin:auto;padding:18px 16px 30px;text-align:center}
.bk{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top,0px));border:1px solid var(--bd);background:var(--p);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:16px;z-index:3;transition:.2s}.bk:active{transform:scale(.9)}

/* scanning */
.radar{position:relative;width:170px;height:170px;margin:80px auto 20px}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--a) 50%,transparent)}
.radar .ring:nth-child(2){inset:22px}.radar .ring:nth-child(3){inset:44px}
.radar .sweepr{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--a) 85%,transparent));animation:spin 1.2s linear infinite;mask-image:radial-gradient(circle,#000 68%,transparent 70%);-webkit-mask-image:radial-gradient(circle,#000 68%,transparent 70%)}
.radar .blip{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);animation:bl 1.2s infinite}
.radar .core{position:absolute;inset:70px;border-radius:50%;background:var(--a);box-shadow:0 0 30px var(--a);animation:pulse2 1s infinite}
@keyframes bl{0%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.4)}100%{opacity:0}}
@keyframes pulse2{50%{transform:scale(1.5);opacity:.5}}
.stp{margin:18px auto 0;max-width:300px;text-align:left}
.sti{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--t2);opacity:.35;transition:.4s;font-size:13px}
.sti i{width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-style:normal;font-size:11px;flex:none}
.sti.now{opacity:1;color:var(--tx)}.sti.now i{border-color:var(--a);border-top-color:transparent;animation:spin .8s linear infinite}
.sti.done{opacity:1;color:var(--tx)}.sti.done i{background:var(--g);border-color:var(--g);color:#031;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.pb{height:6px;border-radius:9px;background:var(--p);overflow:hidden;margin:16px auto 0;max-width:300px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a2),var(--a));box-shadow:0 0 12px var(--a);transition:width .4s}
.cdls{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:44px;margin-top:22px}
.cdls i{width:7px;border-radius:2px;background:var(--a);opacity:.7;animation:cb 1s ease-in-out infinite}
@keyframes cb{0%,100%{height:8px}50%{height:40px}}

/* flash */
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;animation:fl .7s ease-out forwards}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}

/* result */
.pr{margin-top:52px;animation:inn .6s both}.pr b{font-size:21px;display:block}.pr small{color:var(--t2);letter-spacing:.1em}
.dr{position:relative;display:inline-flex;align-items:center;gap:14px;margin:22px 0 12px;padding:16px 34px;border-radius:24px;border:2px solid;animation:slam .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:scale(2.4) rotate(-6deg);opacity:0}60%{transform:scale(.93)}100%{transform:scale(1)}}
.dr span{font-size:40px;animation:bn 1.2s ease-in-out infinite}
.dr b{font-size:42px;letter-spacing:.12em}
@keyframes bn{50%{transform:translateY(-7px)}}
.dr:before,.dr:after{content:"";position:absolute;inset:-2px;border-radius:24px;border:2px solid currentColor;animation:ringo 2s ease-out infinite;opacity:0}
.dr:after{animation-delay:1s}
@keyframes ringo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.dr.CALL{color:var(--g);border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--g) 40%,transparent)}
.dr.PUT{color:var(--r);border-color:var(--r);background:color-mix(in srgb,var(--r) 12%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--r) 40%,transparent)}
.dr.PUT span{animation-direction:reverse}
.spk{margin:6px auto 0;max-width:340px;animation:inn .7s .3s both}
.spk svg{width:100%;height:70px;overflow:visible}
.spk .ln{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spk .ar{opacity:0;animation:fd2 1s 1.4s forwards}@keyframes fd2{to{opacity:1}}
.spk .dot{opacity:0;animation:fd2 .4s 2s forwards}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.g2 div{background:color-mix(in srgb,var(--p) 85%,transparent);border:1px solid var(--bd);border-radius:16px;padding:11px;color:var(--t2);font-size:10px;letter-spacing:.16em;animation:inn .5s both;backdrop-filter:blur(6px)}
.g2 div:nth-child(1){animation-delay:.5s}.g2 div:nth-child(2){animation-delay:.6s}.g2.b div:nth-child(1){animation-delay:.9s}.g2.b div:nth-child(2){animation-delay:1s}
.g2 b{display:block;color:var(--tx);font-size:17px;letter-spacing:0;margin-top:3px}
.cdw{position:relative;width:190px;height:190px;margin:10px auto;animation:inn .6s .7s both}
.cdw svg{width:100%;height:100%;transform:rotate(-90deg)}
.cdw circle{fill:none;stroke-width:8;stroke-linecap:round}
.cdw .tr{stroke:var(--p2)}
.cdw .pg{stroke:var(--a);stroke-dasharray:339.3;stroke-dashoffset:0;transition:stroke-dashoffset .12s linear,stroke .4s;filter:drop-shadow(0 0 8px var(--a))}
.cdw .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cdw small{letter-spacing:.2em;color:var(--t2);font-size:10px}
.cn{font-size:62px;font-weight:900;line-height:1.05;color:var(--a);text-shadow:0 0 26px var(--glow)}
.cn.pp{animation:pn .4s}@keyframes pn{from{transform:scale(1.4);opacity:.3}}
.live .cn{color:var(--g);font-size:56px;animation:glow 1s ease-in-out infinite}
.live.PUT .cn{color:var(--r)}
@keyframes glow{50%{text-shadow:0 0 40px currentColor}}
.live .pg{stroke:var(--g)}.live.PUT .pg{stroke:var(--r)}
.rw{display:flex;justify-content:center;gap:8px;font-size:12px;color:var(--t2);margin-top:4px}
.rw b{color:var(--tx)}
.fx{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:80;animation:fo 1s ease-out forwards}
@keyframes fo{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(.2);opacity:0}}
.hide{display:none}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgfx"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<div class="app">
  <div class="hd">
    <div class="logo"><img id="lg" alt="804 logo"></div>
    <div><h1>804</h1><small>SIGNAL BOT</small></div>
    <span class="sp"></span><span class="chip" id="dc"></span>
  </div>

  <div id="v-home">
    <div class="st2"><div class="cd"><small>SIGNALS</small><b id="n1">0</b></div><div class="cd"><small>PAIRS</small><b id="n2">0</b></div></div>
    <button class="go rp" id="open">✦ GENERATE SIGNAL</button>
    <div class="cd"><h2>ACTIVE</h2><div id="act"></div></div>
    <div class="cd"><h2>RECENT SIGNALS</h2><div id="rec"></div></div>
  </div>

  <div id="v-hist" class="hide"><div class="cd"><h2>HISTORY</h2><div class="fl" id="hf"></div><div id="hl"></div></div></div>

  <div id="v-set" class="hide"><div class="cd"><h2>SETTINGS</h2>
    <label>Colour theme</label>
    <div class="themes" id="ths"></div>
    <label for="md">Data source</label>
    <select id="md"><option value="demo">Simulated prices</option><option value="live">Live feed (adapter)</option></select>
    <label for="ep">Feed endpoint (HTTPS, no secrets)</label>
    <input id="ep" placeholder="https://your-server.example/candles">
    <label class="sw"><input type="checkbox" id="snd"> Sound</label>
    <label class="sw"><input type="checkbox" id="fxo"> Animations &amp; effects</label>
    <button class="sm rp" id="clr">Clear history</button>
  </div></div>

  <p style="text-align:center;color:var(--t2);font-size:11px">804 signals educational purpose ke liye hain. Trading risk ke saath aata hai. Natije guaranteed nahi hote.</p>
</div>

<nav><div>
  <button class="on" data-v="home"><span>📡</span>Signal</button>
  <button data-v="hist"><span>📊</span>History</button>
  <button data-v="set"><span>⚙</span>Settings</button>
</div></nav>

<div class="ov" id="ov"><div class="sheet">
  <div class="sh"><b>✦ New Signal</b><button class="x" id="cx" aria-label="Close">×</button></div>
  <h2>TIMEFRAME</h2><div class="tg" id="tg"></div>
  <h2 style="margin-top:16px">ASSET</h2><div class="fl" id="cats"></div>
  <input id="q" placeholder="Search pairs…" aria-label="Search pairs">
  <div class="al" id="al"></div>
  <button class="go rp" id="go">⚡ GENERATE SIGNAL</button>
</div></div>

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

for(let i=0;i<240;i++){drift=drift*.9+(R()-.5)*vol*.25;const o=p,c=o+drift+(R()-.5)*vol,h=Math.max(o,c)+R()*vol*.5,l=Math.min(o,c)-R()*vol*.5;out.push({t:now-(239-i)*tf,o,h,l,c});p=c}

if(r.status===429)return{candles:[],status:"DATA UNAVAILABLE",note:"Rate limited by provider."};if(!r.ok)throw 0;

const gp=j.filter((c,i)=>i&&c.t-j[i-1].t>tf*1.5).length;if(gp>j.length*.1)return{candles:[],status:"DATA UNAVAILABLE",note:"Too many missing candles ("+gp+")."};const age=Date.now()/1000-j[j.length-1].t;return{candles:j,status:age>tf*3+5?"DELAYED":"LIVE",note:"Data from your adapter."}}catch(e){return{candles:[],status:"DATA UNAVAILABLE",note:"Could not reach the adapter."}}};

/* ---------- analysis layer ---------- */
const ema=(v,p)=>{const k=2/(p+1);let e=v[0];return v.map((x,i)=>i?e=x*k+e*(1-k):e)};
const sma=(v,p)=>v.map((_,i)=>i<p-1?null:v.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p);
function bb(c,p,k){const m=sma(c,p);return m.map((mm,i)=>{if(mm==null)return null;const s=c.slice(i-p+1,i+1),sd=Math.sqrt(s.reduce((a,x)=>a+(x-mm)**2,0)/p);return{m:mm,u:mm+k*sd,l:mm-k*sd}})}
function stoch(cd,kp,d,sm){const raw=cd.map((_,i)=>{if(i<kp-1)return null;const s=cd.slice(i-kp+1,i+1),h=Math.max(...s.map(x=>x.h)),l=Math.min(...s.map(x=>x.l));return h===l?50:100*(cd[i].c-l)/(h-l)});
const sm1=sma(raw.map(x=>x==null?0:x),sm).map((x,i)=>i<kp+sm-2?null:x);const dd=sma(sm1.map(x=>x==null?0:x),d).map((x,i)=>i<kp+sm+d-3?null:x);return{k:sm1,d:dd}}
function ind(cd){const c=cd.map(x=>x.c);return{e1:ema(c,cfg.ema1),e2:ema(c,cfg.ema2),bb:bb(c,cfg.bbp,cfg.bbk),st:stoch(cd,cfg.sk,cfg.sd,cfg.ss)}}
function analyze(cd,tfSec){const I=ind(cd),n=cd.length-1,L=cd[n],c=cd.map(x=>x.c),F=[];
const atr=cd.slice(-14).reduce((a,x)=>a+(x.h-x.l),0)/14;const add=(name,v,txt,kind)=>F.push({name,v:Math.max(-1,Math.min(1,v)),txt,kind});let squeeze=false;
if(tfSec<=30){const gap=(I.e1[n]-I.e2[n])/atr;add("EMA trend",gap*1.5,`EMA${cfg.ema1} ${gap>0?"above":"below"} EMA${cfg.ema2} (${gap.toFixed(2)} ATR)`,"calculated");
const k=I.st.k[n],d=I.st.d[n],pk=I.st.k[n-1],pd=I.st.d[n-1];let sv=k>d?.3:-.3,st=`%K ${k.toFixed(0)} ${k>d?"above":"below"} %D ${d.toFixed(0)}`;
if(k<20&&pk<=pd&&k>d){sv=1;st+=", bullish cross in oversold"}else if(k>80&&pk>=pd&&k<d){sv=-1;st+=", bearish cross in overbought"}else if(k<20)sv=.4;else if(k>80)sv=-.4;add("Stochastic",sv,st,"calculated");
const b=I.bb[n],pos=(L.c-b.l)/(b.u-b.l);add("Bollinger",pos<0?1:pos>1?-1:(.5-pos)*.4,`Price at ${(pos*100).toFixed(0)}% of band width`,"interpretation");
const bw=I.bb.slice(-50).filter(Boolean).map(x=>(x.u-x.l)/x.m),avg=bw.reduce((a,x)=>a+x,0)/bw.length;squeeze=bw[bw.length-1]<avg*.6;add("Volatility",0,squeeze?"Band squeeze: low volatility, score halved":"Bandwidth normal","calculated")}
else{const q=c.slice(-30),h1=q.slice(0,15),h2=q.slice(15),mx=a=>Math.max(...a),mn=a=>Math.min(...a);const hh=mx(h2)>mx(h1),hl=mn(h2)>mn(h1),lh=mx(h2)<mx(h1),ll=mn(h2)<mn(h1);
add("Trend structure",(hh&&hl)?1:(lh&&ll)?-1:0,hh&&hl?"Higher highs & higher lows":lh&&ll?"Lower highs & lower lows":"Mixed structure","calculated");
const l3=cd.slice(-3),up=l3.filter(x=>x.c>x.o).length;add("Price action",(up-1.5)/1.5,`${up}/3 recent candles bullish`,"calculated");
const P=cd[n-1],body=Math.abs(L.c-L.o),lw=Math.min(L.o,L.c)-L.l,uw=L.h-Math.max(L.o,L.c);let pv=0,pt="No clear pattern";
if(L.c>L.o&&P.c<P.o&&L.c>P.o&&L.o<P.c){pv=1;pt="Bullish engulfing"}else if(L.c<L.o&&P.c>P.o&&L.c<P.o&&L.o>P.c){pv=-1;pt="Bearish engulfing"}else if(lw>2*body&&uw<body){pv=.6;pt="Hammer-like"}else if(uw>2*body&&lw<body){pv=-.6;pt="Shooting-star-like"}add("Candlestick",pv,pt,"interpretation");
const w=cd.slice(-60,-1),sup=Math.min(...w.map(x=>x.l)),res=Math.max(...w.map(x=>x.h));let sr=0,st=`Range ${sup.toFixed(4)}–${res.toFixed(4)}`;if(L.c-sup<atr*.6){sr=.8;st+=", near support"}else if(res-L.c<atr*.6){sr=-.8;st+=", near resistance"}add("Support/Resistance",sr,st,"interpretation");
const gp=(L.o-P.c)/atr;add("Price gap",0,Math.abs(gp)>.3?`Gap of ${gp.toFixed(2)} ATR vs prior close`:"No notable gap","calculated");
add("Momentum",(L.c-c[n-5])/atr/3,`5-candle change ${((L.c-c[n-5])/atr).toFixed(2)} ATR`,"calculated");add("Moving average",(L.c-I.e2[n])/atr/1.5,`Price ${L.c>I.e2[n]?"above":"below"} EMA${cfg.ema2}`,"calculated");
add("Liquidity zones",0,"Not assessed: needs volume / order-book data","unavailable");add("Multi-timeframe",0,"Not assessed: higher-timeframe data not loaded","unavailable")}
const act=F.filter(f=>Math.abs(f.v)>.05);let sc=F.reduce((a,f)=>a+f.v,0)/Math.max(1,F.filter(f=>f.kind!=="unavailable"&&f.v!==undefined&&f.name!=="Volatility"&&f.name!=="Price gap"&&f.name!=="Liquidity zones").length);if(squeeze)sc*=.5;
const dir0=sc>0?"CALL":"PUT",ag=act.length?act.filter(f=>Math.sign(f.v)===Math.sign(sc)).length/act.length*100:0;

  const a=asset(),tf=TFS[S.tf][1];
  const ST=["Retrieving market data","Checking candles","Analysing the market","Locking the signal"];
  const blips=[[20,30],[70,22],[78,64],[30,74],[55,48]].map((p,i)=>`<i class="blip" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${i*.25}s"></i>`).join("");
  const bars=Array.from({length:14},(_,i)=>`<i style="animation-delay:${i*.08}s"></i>`).join("");
  rn.innerHTML=`<div class="bgfx"><div class="orb o1"></div><div class="orb o2"></div></div><div class="sc"><div class="radar"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="sweepr"></div>${blips}<div class="core"></div></div>
  <b style="font-size:18px">${a[2]} ${a[0]}</b><div style="color:var(--t2);font-size:12px;letter-spacing:.15em;margin-top:2px">${SL[S.tf]} · SCANNING</div>
  <div class="stp">${ST.map((s,i)=>`<div class="sti" id="s${i}"><i>${i+1}</i>${s}</div>`).join("")}</div><div class="pb"><i id="pg"></i></div><div class="cdls">${bars}</div></div>`;
  const P=i=>{if(i>0){const p=$("s"+(i-1));p.className="sti done";p.querySelector("i").textContent="✓";beep(500+i*120)}if(i<4)$("s"+i).className="sti now";$("pg").style.width=Math.min(100,(i+1)*25)+"%"};
  P(0);const rp=feed(a,tf);await Promise.all([rp,sleep(700)]);const r=await rp;S.candles=r.candles;S.status=r.status;
  P(1);await sleep(650);P(2);const an=analyzeAll(r.candles);await sleep(750);P(3);await sleep(700);
  const dc=an.dir,t=Date.now(),dcol=dc==="CALL"?cssv("--g"):cssv("--r");P(4);await sleep(250);
  hist.unshift({a:S.asset,tf:TFS[S.tf][0],d:dc,ts:t,st:r.status,sc:Math.round(an.score),ag:Math.round(an.ag),p:an.price,why:"",F:an.F.map(f=>({n:f.name,v:+f.v.toFixed(2),t:f.txt}))});hist=hist.slice(0,200);save();

  flash(dcol);beep(dc==="CALL"?900:400);
  rn.innerHTML=`<div class="bgfx"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div><div class="sc"><button class="bk" id="bk" aria-label="Back">←</button>
  <div class="pr"><b>${a[2]} ${a[0]}</b><small>${SL[S.tf]} · ${TFS[S.tf][0]}</small></div>
  <div class="dr ${dc}" id="drb"><span>${dc==="CALL"?"▲":"▼"}</span><b>${dc}</b></div>
  <div class="spk">${spark(r.candles,dc)}</div>
  <div class="g2"><div>EXPIRY<b>${SL[S.tf]}</b></div><div>PRICE<b id="pv">–</b></div></div>
  <div class="cdw" id="cw"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="pg" id="ring" cx="60" cy="60" r="54"/></svg><div class="mid"><small id="cl">TAKE TRADE IN</small><div class="cn" id="cn">–</div></div></div>
  <div class="rw"><span>ENTRY</span><b id="er">Waiting for next candle</b></div>
  <div class="g2 b"><div>TIME<b>${new Date(t).toLocaleTimeString()}</b></div><div>DATA<b style="color:${col(r.status)}">${lb(r.status)}</b></div></div>
  <button class="go rp" id="again">NEW SIGNAL</button></div>`;
  burst($("drb"),34);
  // price count-up
  {const el=$("pv"),to=an.price,d=dec(a),s0=performance.now();const f=now=>{const k=Math.min(1,(now-s0)/900),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(d);if(k<1)requestAnimationFrame(f);else el.textContent=to.toFixed(d)};requestAnimationFrame(f)}
  $("bk").onclick=()=>{clearInterval(tmr);rn.className="run";view("home")};
  $("again").onclick=()=>{clearInterval(tmr);rn.className="run";view("home");setTimeout(()=>$("open").click(),50)};

  let b=Math.ceil(Date.now()/1000/tf)*tf;if(b-Date.now()/1000<1.5)b+=tf;const w0=b-Date.now()/1000,C=339.3;let phase=1,last=-1;const mmss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const ring=f=>$("ring").style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,f)));
  clearInterval(tmr);tmr=setInterval(()=>{const now=Date.now()/1000;
    if(phase===1){const left=b-now;if(left<=0){phase=2;$("cl").textContent="ENTRY OPEN";$("er").textContent="Entry window";$("cw").className="cdw live "+dc;flash(dcol);burst($("cw"),36);beep(1000);return}
      ring(left/w0);const sec=Math.ceil(left);if(sec!==last){last=sec;const c=$("cn");c.textContent=sec>10?mmss(sec):sec;c.classList.remove("pp");void c.offsetWidth;c.classList.add("pp");if(sec<=3)beep(800)}}
    else{const el=now-b,rem=Math.max(0,tf-el),sec=Math.ceil(rem);$("cn").textContent="GO";ring(rem/tf);$("er").textContent=sec>0?"Expires in "+(sec>59?mmss(sec):sec+"s"):"Expired";if(rem<=0){clearInterval(tmr);$("cl").textContent="EXPIRED";$("cn").textContent="—";$("cw").className="cdw"}}
  },100)}
$("go").onclick=run;

/* ---------- settings ---------- */
$("md").value=cfg.mode;$("ep").value=cfg.ep||"";$("snd").checked=!!cfg.sound;$("fxo").checked=!!cfg.anim;
$("md").onchange=e=>{cfg.mode=e.target.value;save();prime()};
$("ep").onchange=e=>{const v=e.target.value.trim();if(v&&!/^https:\/\//.test(v)){alert("Endpoint must start with https://");e.target.value=cfg.ep||"";return}cfg.ep=v;AV=null;save();prime()};
$("snd").onchange=e=>{cfg.sound=e.target.checked;save();beep()};
$("fxo").onchange=e=>{cfg.anim=e.target.checked;save();particles()};
$("clr").onclick=()=>{if(confirm("Clear all saved signals?")){hist=[];save();home()}};
async function prime(){const r=await feed(asset(),TFS[S.tf][1]);S.status=r.status;home()}

applyTheme();particles();home();prime();
</script>
</body>
</html>
